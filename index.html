<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inicio · AULA SUPPORT</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-amber-50/50 text-slate-700 min-h-screen flex flex-col">
<div id="nav"></div>
<main class="max-w-5xl w-full mx-auto px-4 py-8 flex-1">

<section class="rounded-3xl bg-gradient-to-br from-sky-100 via-violet-100 to-emerald-100 p-8 mb-8">
  <h1 class="text-4xl font-bold text-sky-900" data-tp="blog"></h1>
  <p class="mt-2 text-lg" data-tp="bio"></p>
  <p class="mt-3 font-semibold text-slate-700">👩‍🏫 <span data-tp="nombre"></span> · <span data-tp="titulo"></span></p>
  <a href="avance.html" class="px-4 py-2 rounded-full bg-sky-200 text-sky-900 font-semibold hover:bg-sky-300 inline-block mt-5">🚀 Ver la carrera espacial</a>
</section>
<h2 class="text-2xl font-bold mb-3">Asignaturas</h2>
<div id="mats" class="grid md:grid-cols-3 gap-4 mb-8"></div>
<h2 class="text-2xl font-bold mb-3">Últimas publicaciones</h2>
<div id="posts" class="grid md:grid-cols-3 gap-4"></div>
</main>
<div id="foot"></div>
<script src="db.js"></script>
<script src="profile-loader.js"></script>
<script>
DB.init().then(async()=>{

const M = await DB.get("materias"), P = await DB.get("posts"), e = DB.esc;
mats.innerHTML = M.map(m => `<a href="publicaciones.html?m=${m.id}" class="rounded-2xl bg-${m.color}-100 border border-${m.color}-200 p-5 hover:shadow-md"><div class="text-3xl">${m.icono}</div><div class="font-bold mt-1 text-${m.color}-900">${e(m.nombre)}</div></a>`).join("");
posts.innerHTML = P.slice(-3).reverse().map(p => `<a href="lectura.html?id=${p.id}" class="bg-white rounded-2xl border border-slate-200 shadow-sm p-5 block hover:shadow-md"><div class="text-xs text-slate-400">${e(p.fecha)}</div><div class="font-semibold mt-1">${e(p.titulo)}</div></a>`).join("");
});
</script>
</body></html>
