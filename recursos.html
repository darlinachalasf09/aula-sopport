<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recursos · AULA SUPPORT</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-amber-50/50 text-slate-700 min-h-screen flex flex-col">
<div id="nav"></div>
<main class="max-w-5xl w-full mx-auto px-4 py-8 flex-1">

<h1 class="text-3xl font-bold mb-4">Recursos</h1><div id="r" class="grid md:grid-cols-2 gap-4"></div>
</main>
<div id="foot"></div>
<script src="db.js"></script>
<script src="profile-loader.js"></script>
<script>
DB.init().then(async()=>{

const M = await DB.get("materias"), e = DB.esc;
r.innerHTML = (await DB.get("recursos")).map(x => { const m = M.find(y => y.id === x.materia) || {color:"slate",nombre:""};
  return `<a href="${e(x.url)}" target="_blank" rel="noopener" class="block rounded-2xl bg-${m.color}-50 border border-${m.color}-200 p-5 hover:shadow-md"><div class="text-xs text-${m.color}-800">${e(m.nombre)}</div><div class="font-semibold mt-1">📎 ${e(x.titulo)}</div></a>`; }).join("");
});
</script>
</body></html>
