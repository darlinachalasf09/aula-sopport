<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Editor · AULA SUPPORT</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-amber-50/50 text-slate-700 min-h-screen flex flex-col">
<div id="nav"></div>
<main class="max-w-5xl w-full mx-auto px-4 py-8 flex-1">

<h1 class="text-3xl font-bold mb-4">Nueva publicación</h1>
<div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-5 space-y-3"><select id="m" class="w-full border border-slate-300 rounded-xl px-3 py-2 bg-white"></select><input id="t" class="w-full border border-slate-300 rounded-xl px-3 py-2 bg-white" placeholder="Título"><textarea id="x" rows="8" class="w-full border border-slate-300 rounded-xl px-3 py-2 bg-white" placeholder="Contenido"></textarea><button id="g" class="px-4 py-2 rounded-full bg-sky-200 text-sky-900 font-semibold hover:bg-sky-300">Publicar</button></div>
</main>
<div id="foot"></div>
<script src="db.js"></script>
<script src="profile-loader.js"></script>
<script>
DB.init().then(async()=>{

const M = await DB.get("materias");
m.innerHTML = M.map(x => `<option value="${x.id}">${DB.esc(x.nombre)}</option>`).join("");
g.onclick = async () => { if (!t.value.trim() || !x.value.trim()) return alert("Completa título y contenido");
  const P = await DB.get("posts"); P.push({id: Date.now(), materia: m.value, titulo: t.value.trim(), fecha: new Date().toISOString().slice(0, 10), texto: x.value});
  await DB.set("posts", P); location.href = "publicaciones.html"; };
});
</script>
</body></html>
