<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gestión · AULA SUPPORT</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-amber-50/50 text-slate-700 min-h-screen flex flex-col">
<div id="nav"></div>
<main class="max-w-5xl w-full mx-auto px-4 py-8 flex-1">

<h1 class="text-3xl font-bold mb-4">Tareas y calificaciones</h1>
<select id="m" class="w-full border border-slate-300 rounded-xl px-3 py-2 bg-white max-w-md mb-4"></select>
<div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-5 overflow-x-auto"><table class="w-full text-sm"><thead><tr class="text-left text-slate-500"><th class="p-2">Estudiante</th><th class="p-2">Tareas entregadas</th><th class="p-2">Total</th><th class="p-2">Nota (0-100)</th></tr></thead><tbody id="tb"></tbody></table>
<button id="g" class="px-4 py-2 rounded-full bg-sky-200 text-sky-900 font-semibold hover:bg-sky-300 mt-4">Guardar cambios</button> <span id="ok" class="text-emerald-700 text-sm"></span></div>
<h2 class="text-xl font-bold mt-8 mb-3">Publicaciones</h2><div id="pl" class="space-y-2"></div>
</main>
<div id="foot"></div>
<script src="db.js"></script>
<script src="profile-loader.js"></script>
<script>
DB.init().then(async()=>{

const M = await DB.get("materias"); let S = await DB.get("estudiantes"), e = DB.esc;
m.innerHTML = M.map(x => `<option value="${x.id}">${e(x.nombre)}</option>`).join("");
const draw = () => { tb.innerHTML = S.map(s => { const p = s.prog[m.value] || (s.prog[m.value] = {ent:0,tot:5,nota:0});
  return `<tr class="border-t"><td class="p-2">${s.nave} ${e(s.nombre)}</td><td class="p-2"><input type="number" min="0" max="${p.tot}" value="${p.ent}" data-s="${s.id}" data-k="ent" class="w-20 border rounded-lg px-2 py-1"></td><td class="p-2">${p.tot}</td><td class="p-2"><input type="number" min="0" max="100" value="${p.nota}" data-s="${s.id}" data-k="nota" class="w-20 border rounded-lg px-2 py-1"></td></tr>`; }).join(""); };
m.onchange = draw; draw();
g.onclick = async () => { tb.querySelectorAll("input").forEach(i => { const s = S.find(x => x.id === +i.dataset.s); s.prog[m.value][i.dataset.k] = Math.max(0, +i.value || 0); });
  await DB.set("estudiantes", S); ok.textContent = "✔ Guardado"; };
const pl_ = async () => { const P = await DB.get("posts"); pl.innerHTML = P.map(p => `<div class="bg-white rounded-xl border p-3 flex justify-between"><span>${e(p.titulo)}</span><button data-d="${p.id}" class="text-rose-600 text-sm">Eliminar</button></div>`).join("");
  pl.querySelectorAll("button").forEach(b => b.onclick = async () => { await DB.set("posts", P.filter(p => p.id !== +b.dataset.d)); pl_(); }); };
pl_();
});
</script>
</body></html>
