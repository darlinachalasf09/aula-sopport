<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Publicaciones · AULA SUPPORT</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-amber-50/50 text-slate-700 min-h-screen flex flex-col">
<div id="nav"></div>
<main class="max-w-5xl w-full mx-auto px-4 py-8 flex-1">

<h1 class="text-3xl font-bold mb-4">Publicaciones</h1>
<select id="f" class="w-full border border-slate-300 rounded-xl px-3 py-2 bg-white max-w-sm mb-5"></select>
<div id="list" class="space-y-3"></div>
</main>
<div id="foot"></div>
<script src="db.js"></script>
<script src="profile-loader.js"></script>
<script>
DB.init().then(async()=>{

const M = await DB.get("materias"), P = await DB.get("posts"), e = DB.esc;
const q = new URLSearchParams(location.search).get("m") || "all";
f.innerHTML = '<option value="all">Todas las asignaturas</option>' + M.map(m => `<option value="${m.id}" ${m.id===q?"selected":""}>${e(m.nombre)}</option>`).join("");
const draw = () => { list.innerHTML = P.filter(p => f.value === "all" || p.materia === f.value).reverse().map(p => { const m = M.find(x => x.id === p.materia) || {color:"slate",nombre:""};
  return `<a href="lectura.html?id=${p.id}" class="block bg-white rounded-2xl border border-slate-200 p-5 hover:shadow-md"><span class="text-xs px-2 py-1 rounded-full bg-${m.color}-100 text-${m.color}-800">${e(m.nombre)}</span><div class="font-semibold text-lg mt-2">${e(p.titulo)}</div><div class="text-xs text-slate-400">${e(p.fecha)}</div></a>`; }).join("") || "<p>No hay publicaciones.</p>"; };
f.onchange = draw; draw();
});
</script>
</body></html>
