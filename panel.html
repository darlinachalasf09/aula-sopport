<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panel docente · AULA SUPPORT</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-amber-50/50 text-slate-700 min-h-screen flex flex-col">
<div id="nav"></div>
<main class="max-w-5xl w-full mx-auto px-4 py-8 flex-1">

<h1 class="text-3xl font-bold">Panel de <span data-tp="nombre"></span></h1>
<div id="st" class="grid grid-cols-2 md:grid-cols-4 gap-3 my-5"></div>
<div class="grid md:grid-cols-3 gap-3">
  <a class="bg-white rounded-2xl border border-slate-200 shadow-sm p-5 hover:shadow-md" href="editor.html">✍️ Nueva publicación</a>
  <a class="bg-white rounded-2xl border border-slate-200 shadow-sm p-5 hover:shadow-md" href="gestion.html">📊 Tareas y calificaciones</a>
  <a class="bg-white rounded-2xl border border-slate-200 shadow-sm p-5 hover:shadow-md" href="biblioteca.html">📚 Biblioteca de recursos</a>
  <a class="bg-white rounded-2xl border border-slate-200 shadow-sm p-5 hover:shadow-md" href="moderacion.html">💬 Moderación</a>
  <a class="bg-white rounded-2xl border border-slate-200 shadow-sm p-5 hover:shadow-md" href="perfil.html">👩‍🏫 Mi perfil</a>
  <a class="bg-white rounded-2xl border border-slate-200 shadow-sm p-5 hover:shadow-md" href="avance.html">🚀 Carrera espacial</a>
</div>
</main>
<div id="foot"></div>
<script src="db.js"></script>
<script src="profile-loader.js"></script>
<script>
DB.init().then(async()=>{

const n = async k => (await DB.get(k)).length, C = await DB.get("comentarios");
st.innerHTML = [["Publicaciones", await n("posts")], ["Recursos", await n("recursos")], ["Estudiantes", await n("estudiantes")], ["Comentarios pendientes", C.filter(c => c.estado === "pendiente").length]].map(([t, v]) => `<div class="rounded-2xl bg-sky-100 p-4 text-center"><div class="text-3xl font-bold text-sky-900">${v}</div><div class="text-xs">${t}</div></div>`).join("");
});
</script>
</body></html>
