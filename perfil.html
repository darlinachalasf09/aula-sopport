<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Perfil · AULA SUPPORT</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-amber-50/50 text-slate-700 min-h-screen flex flex-col">
<div id="nav"></div>
<main class="max-w-5xl w-full mx-auto px-4 py-8 flex-1">

<h1 class="text-3xl font-bold mb-4">Perfil docente</h1>
<div id="fm" class="bg-white rounded-2xl border border-slate-200 shadow-sm p-5 space-y-3"></div>
</main>
<div id="foot"></div>
<script src="db.js"></script>
<script src="profile-loader.js"></script>
<script>
DB.init().then(async()=>{

const p = await DB.get("profile"), lab = {blog:"Nombre del blog", nombre:"Nombre de la docente", titulo:"Título", centro:"Centro educativo", materias:"Asignaturas", bio:"Descripción"};
fm.innerHTML = Object.keys(lab).map(k => `<label class="block text-sm">${lab[k]}<input data-k="${k}" value="${DB.esc(p[k])}" class="w-full border border-slate-300 rounded-xl px-3 py-2 mt-1"></label>`).join("") + '<button id="g" class="px-4 py-2 rounded-full bg-sky-200 text-sky-900 font-semibold">Guardar perfil</button> <span id="ok" class="text-emerald-700 text-sm"></span>';
g.onclick = async () => { fm.querySelectorAll("input").forEach(i => p[i.dataset.k] = i.value); await DB.set("profile", p);
  document.querySelectorAll("[data-tp]").forEach(x => x.textContent = p[x.dataset.tp] || ""); ok.textContent = "✔ Guardado"; };
});
</script>
</body></html>
