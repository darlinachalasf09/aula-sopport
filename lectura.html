<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lectura · AULA SUPPORT</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-amber-50/50 text-slate-700 min-h-screen flex flex-col">
<div id="nav"></div>
<main class="max-w-5xl w-full mx-auto px-4 py-8 flex-1">

<article id="art" class="bg-white rounded-2xl border border-slate-200 shadow-sm p-5"></article>
<h2 class="text-xl font-bold mt-8 mb-3">Comentarios</h2>
<div id="coms" class="space-y-2 mb-4"></div>
<div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-5 space-y-2"><input id="au" class="w-full border border-slate-300 rounded-xl px-3 py-2 bg-white" placeholder="Tu nombre"><textarea id="tx" class="w-full border border-slate-300 rounded-xl px-3 py-2 bg-white" placeholder="Escribe un comentario"></textarea><button id="env" class="px-4 py-2 rounded-full bg-sky-200 text-sky-900 font-semibold hover:bg-sky-300">Enviar</button><p id="msg" class="text-sm text-emerald-700"></p></div>
</main>
<div id="foot"></div>
<script src="db.js"></script>
<script src="profile-loader.js"></script>
<script>
DB.init().then(async()=>{

const id = +new URLSearchParams(location.search).get("id"), e = DB.esc;
const p = (await DB.get("posts")).find(x => x.id === id);
if (!p) { art.textContent = "Publicación no encontrada."; return; }
art.innerHTML = `<div class="text-xs text-slate-400">${e(p.fecha)}</div><h1 class="text-3xl font-bold my-2">${e(p.titulo)}</h1><div class="whitespace-pre-line leading-relaxed">${e(p.texto)}</div>`;
const show = async () => { coms.innerHTML = (await DB.get("comentarios")).filter(c => c.post === id && c.estado === "aprobado").map(c => `<div class="bg-violet-50 rounded-xl p-3"><b>${e(c.autor)}</b>: ${e(c.texto)}</div>`).join("") || '<p class="text-sm text-slate-400">Sin comentarios aún.</p>'; };
await show();
env.onclick = async () => { if (!tx.value.trim()) return; const C = await DB.get("comentarios"); C.push({id: Date.now(), post: id, autor: au.value.trim() || "Anónimo", texto: tx.value.trim(), estado: "pendiente"}); await DB.set("comentarios", C); tx.value = ""; msg.textContent = "Comentario enviado. Será visible cuando la docente lo apruebe."; };
});
</script>
</body></html>
