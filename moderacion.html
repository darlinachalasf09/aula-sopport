<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Moderación · AULA SUPPORT</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-amber-50/50 text-slate-700 min-h-screen flex flex-col">
<div id="nav"></div>
<main class="max-w-5xl w-full mx-auto px-4 py-8 flex-1">

<h1 class="text-3xl font-bold mb-4">Moderación de comentarios</h1><div id="l" class="space-y-2"></div>
</main>
<div id="foot"></div>
<script src="db.js"></script>
<script src="profile-loader.js"></script>
<script>
DB.init().then(async()=>{

const e = DB.esc;
const draw = async () => { const C = await DB.get("comentarios");
  l.innerHTML = C.map(c => `<div class="bg-white rounded-xl border p-4 flex flex-wrap justify-between gap-2"><div><b>${e(c.autor)}</b>: ${e(c.texto)} <span class="text-xs px-2 py-0.5 rounded-full ${c.estado === "aprobado" ? "bg-emerald-100" : "bg-amber-100"}">${c.estado}</span></div><div class="space-x-2 text-sm"><button data-a="${c.id}" class="text-emerald-700">Aprobar</button><button data-d="${c.id}" class="text-rose-600">Eliminar</button></div></div>`).join("") || "<p>Sin comentarios.</p>";
  l.querySelectorAll("[data-a]").forEach(b => b.onclick = async () => { C.find(c => c.id === +b.dataset.a).estado = "aprobado"; await DB.set("comentarios", C); draw(); });
  l.querySelectorAll("[data-d]").forEach(b => b.onclick = async () => { await DB.set("comentarios", C.filter(c => c.id !== +b.dataset.d)); draw(); }); };
draw();
});
</script>
</body></html>
