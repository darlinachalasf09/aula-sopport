<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Biblioteca · AULA SUPPORT</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-amber-50/50 text-slate-700 min-h-screen flex flex-col">
<div id="nav"></div>
<main class="max-w-5xl w-full mx-auto px-4 py-8 flex-1">

<h1 class="text-3xl font-bold mb-4">Biblioteca de recursos</h1>
<div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-5 space-y-3 mb-6"><select id="m" class="w-full border border-slate-300 rounded-xl px-3 py-2 bg-white"></select><input id="t" class="w-full border border-slate-300 rounded-xl px-3 py-2 bg-white" placeholder="Título del recurso"><input id="u" class="w-full border border-slate-300 rounded-xl px-3 py-2 bg-white" placeholder="Enlace (https://...)"><button id="g" class="px-4 py-2 rounded-full bg-sky-200 text-sky-900 font-semibold hover:bg-sky-300">Agregar</button></div>
<div id="l" class="space-y-2"></div>
</main>
<div id="foot"></div>
<script src="db.js"></script>
<script src="profile-loader.js"></script>
<script>
DB.init().then(async()=>{

const M = await DB.get("materias"), e = DB.esc;
m.innerHTML = M.map(x => `<option value="${x.id}">${e(x.nombre)}</option>`).join("");
const draw = async () => { const R = await DB.get("recursos"); l.innerHTML = R.map(r => `<div class="bg-white rounded-xl border p-3 flex justify-between"><span>📎 ${e(r.titulo)}</span><button data-d="${r.id}" class="text-rose-600 text-sm">Eliminar</button></div>`).join("");
  l.querySelectorAll("button").forEach(b => b.onclick = async () => { await DB.set("recursos", R.filter(r => r.id !== +b.dataset.d)); draw(); }); };
g.onclick = async () => { if (!t.value.trim()) return; const R = await DB.get("recursos"); R.push({id: Date.now(), materia: m.value, titulo: t.value.trim(), url: u.value.trim() || "#"}); await DB.set("recursos", R); t.value = u.value = ""; draw(); };
draw();
});
</script>
</body></html>
